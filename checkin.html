<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Redirecting… — Rowan ACDA</title>
<meta name="robots" content="noindex, nofollow"/>
<script>
  // Event check-in now happens from a signed-in account — carry the code
  // (from an already-printed/shared QR code or link) over to /account.html.
  var code = new URLSearchParams(location.search).get('code');
  location.replace('/account.html' + (code ? ('?code=' + encodeURIComponent(code)) : ''));
</script>
</head>
<body>
<p>Redirecting to <a href="/account.html">My Account</a>…</p>
</body>
</html>
